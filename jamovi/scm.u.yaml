name: scm
title: Synthetic Control
jus: '3.0'
stage: 0
compilerMode: tame
children:
    - type: VariableSupplier
      persistentItems: false
      stretchFactor: 1
      children:
          - type: TargetLayoutBox
            label: Outcome
            children:
                - type: VariablesListBox
                  name: outcome
                  isTarget: true
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Unit
            children:
                - type: VariablesListBox
                  name: unit
                  isTarget: true
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Time
            children:
                - type: VariablesListBox
                  name: time
                  isTarget: true
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Predictors
            children:
                - type: VariablesListBox
                  name: predictors
                  isTarget: true
    - type: LayoutBox
      margin: large
      children:
        - type: LevelSelector
          name: treatedUnit
          label: Treated unit
        - type: TextBox
          name: treatmentTime
          label: First treated period
          format: number
        - type: TextBox
          name: donorExclude
          label: Exclude donors
          format: string
        - type: CollapseBox
          label: Estimation
          collapsed: false
          children:
              - type: LayoutBox
                children:
                    - type: ComboBox
                      name: predictorStat
                    - type: TextBox
                      name: seed
                      label: Random seed
                      format: number
                    - type: TextBox
                      name: optStarts
                      label: Random starts
                      format: number
        - type: CollapseBox
          label: Placebo Test
          collapsed: true
          children:
              - type: LayoutBox
                children:
                    - type: CheckBox
                      name: placebo
                    - type: ComboBox
                      name: pValueMethod
                      enable: (placebo)
                    - type: TextBox
                      name: placeboPreRatio
                      label: Pre-fit filter (max RMSPE ratio)
                      format: number
                      enable: (placebo)
        - type: CollapseBox
          label: Robustness Checks
          collapsed: true
          children:
              - type: LayoutBox
                style: inline
                children:
                    - type: CheckBox
                      name: looCheck
                    - type: TextBox
                      name: looSubset
                      label: Subset
                      format: string
                      stretchFactor: 1
                      enable: (looCheck || looFig)
              - type: CheckBox
                name: looFig
              - type: LayoutBox
                style: inline
                children:
                    - type: CheckBox
                      name: timingCheck
                    - type: TextBox
                      name: timingOffsets
                      label: Offsets (years)
                      format: string
                      stretchFactor: 1
                      enable: (timingCheck || timingFig)
              - type: CheckBox
                name: timingFig
              - type: LayoutBox
                style: inline
                children:
                    - type: CheckBox
                      name: preLengthCheck
                    - type: TextBox
                      name: preLengthDrops
                      label: Years dropped
                      format: string
                      stretchFactor: 1
                      enable: (preLengthCheck || preLengthFig)
              - type: CheckBox
                name: preLengthFig
              - type: LayoutBox
                style: inline
                children:
                    - type: CheckBox
                      name: intimeCheck
                    - type: TextBox
                      name: intimeOffsets
                      label: Years before treatment
                      format: string
                      stretchFactor: 1
                      enable: (intimeCheck || intimeFig)
              - type: CheckBox
                name: intimeFig
        - type: CollapseBox
          label: Output
          collapsed: true
          children:
              - type: CheckBox
                name: showHelp
                label: Method notes
