      title: Placebo fits (internal)
      type: Image
      renderFun: .plotNone
      visible: false
      clearWith:
        - outcome
        - unit
        - time
        - treatedUnit
        - treatmentTime
        - predictors
        - predictorStat
        - donorExclude
        - optStarts
        - seed

    - name: looState
      title: Leave-one-out fits (internal)
      type: Image
      renderFun: .plotNone
      visible: false
      clearWith:
        - outcome
        - unit
        - time
        - treatedUnit
        - treatmentTime
        - predictors
        - predictorStat
        - donorExclude
        - optStarts
        - seed
