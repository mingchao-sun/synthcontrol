---
name: scm
title: Synthetic Control
jrs: '1.1'

items:
    - name: helpText
      title: Method notes
      type: Html
      visible: (showHelp)

    - name: notes
      title: Notes
      type: Html
      visible: true

    - name: summary
      title: Pre- and post-treatment fit
      type: Table
      visible: (outcome)
      refs: abadie2010
      clearWith:
        - outcome
        - unit
        - time
        - treatedUnit
        - treatmentTime
        - predictors
        - predictorStat
        - donorExclude
        - optStarts
        - seed
      columns:
          - name: metric
            title: Metric
            type: text
          - name: value
            title: Value
            type: number

    - name: permTable
      title: Permutation test
      type: Table
      visible: (placebo)
      refs: abadie2010
      clearWith:
        - outcome
        - unit
        - time
        - treatedUnit
        - treatmentTime
        - predictors
        - predictorStat
        - donorExclude
        - optStarts
        - seed
        - placebo
        - placeboPreRatio
        - pValueMethod
      columns:
          - name: sample
            title: Placebo set
            type: text
          - name: n
            title: Placebos
            type: integer
          - name: p
            title: p-value
            type: number
            format: zto,pvalue

    - name: weights
      title: Donor weights
      type: Table
      visible: (outcome)
      refs:
          - abadie2010
          - quadprog
      clearWith:
        - outcome
        - unit
        - time
        - treatedUnit
        - treatmentTime
        - predictors
        - predictorStat
        - donorExclude
        - optStarts
        - seed
      columns:
          - name: unit
            title: Donor unit
            type: text
          - name: weight
            title: Weight
            type: number

    - name: balance
      title: Predictor balance
      type: Table
      visible: (outcome)
      clearWith:
        - outcome
        - unit
        - time
        - treatedUnit
        - treatmentTime
        - predictors
        - predictorStat
        - donorExclude
        - optStarts
        - seed
      columns:
          - name: predictor
            title: Predictor
            type: text
          - name: treated
            title: Treated
            type: number
          - name: synthetic
            title: Synthetic
            type: number

    - name: pathsPlot
      title: Treated vs synthetic
      type: Image
      width: 600
      height: 400
      renderFun: .plotPaths
      visible: (outcome)
      clearWith:
        - outcome
        - unit
        - time
        - treatedUnit
        - treatmentTime
        - predictors
        - predictorStat
        - donorExclude
        - optStarts
        - seed

    - name: gapsPlot
      title: Gap in outcome
      type: Image
      width: 600
      height: 400
      renderFun: .plotGaps
      visible: (outcome)
      clearWith:
        - outcome
        - unit
        - time
        - treatedUnit
        - treatmentTime
        - predictors
        - predictorStat
        - donorExclude
        - optStarts
        - seed
        - placebo
        - placeboPreRatio
        - pValueMethod

    - name: weightsPlot
      title: Donor weights
      type: Image
      width: 600
      height: 400
      renderFun: .plotWeights
      visible: (outcome)
      clearWith:
        - outcome
        - unit
        - time
        - treatedUnit
        - treatmentTime
        - predictors
        - predictorStat
        - donorExclude
        - optStarts
        - seed

    - name: looTable
      title: Leave-one-out donor robustness
      type: Table
      visible: (looCheck)
      clearWith:
        - outcome
        - unit
        - time
        - treatedUnit
        - treatmentTime
        - predictors
        - predictorStat
        - donorExclude
        - optStarts
        - seed
        - looSubset
      columns:
          - name: removed
            title: Removed donor
            type: text
          - name: att
            title: Average post-treatment gap
            type: number
          - name: ratio
            title: Post / pre RMSPE ratio
            type: number

    - name: looPlot
      title: Leave-one-out ATT
      type: Image
      width: 600
      height: 500
      renderFun: .plotLoo
      visible: (looFig)
      clearWith:
        - outcome
        - unit
        - time
        - treatedUnit
        - treatmentTime
        - predictors
        - predictorStat
        - donorExclude
        - optStarts
        - seed
        - looSubset

    - name: timingTable
      title: Treatment timing sensitivity
      type: Table
      visible: (timingCheck)
      clearWith:
        - outcome
        - unit
        - time
        - treatedUnit
        - treatmentTime
        - predictors
        - predictorStat
        - donorExclude
        - optStarts
        - seed
        - timingOffsets
      columns:
          - name: scenario
            title: Scenario
            type: text
          - name: att
            title: Average post-treatment gap
            type: number
          - name: ratio
            title: Post / pre RMSPE ratio
            type: number

    - name: timingPlot
      title: Treatment timing sensitivity
      type: Image
      width: 600
      height: 400
      renderFun: .plotTiming
      visible: (timingFig)
      clearWith:
        - outcome
        - unit
        - time
        - treatedUnit
        - treatmentTime
        - predictors
        - predictorStat
        - donorExclude
        - optStarts
        - seed
        - timingOffsets

    - name: preLengthTable
      title: Pre-period length sensitivity
      type: Table
      visible: (preLengthCheck)
      clearWith:
        - outcome
        - unit
        - time
        - treatedUnit
        - treatmentTime
        - predictors
        - predictorStat
        - donorExclude
        - optStarts
        - seed
        - preLengthDrops
      columns:
          - name: scenario
            title: Scenario
            type: text
          - name: att
            title: Average post-treatment gap
            type: number
          - name: ratio
            title: Post / pre RMSPE ratio
            type: number

    - name: preLengthPlot
      title: Pre-period length sensitivity
      type: Image
      width: 600
      height: 400
      renderFun: .plotPreLength
      visible: (preLengthFig)
      clearWith:
        - outcome
        - unit
        - time
        - treatedUnit
        - treatmentTime
        - predictors
        - predictorStat
        - donorExclude
        - optStarts
        - seed
        - preLengthDrops

    - name: intimeTable
      title: In-time placebo
      type: Table
      visible: (intimeCheck)
      clearWith:
        - outcome
        - unit
        - time
        - treatedUnit
        - treatmentTime
        - predictors
        - predictorStat
        - donorExclude
        - optStarts
        - seed
        - intimeOffsets
      columns:
          - name: scenario
            title: Scenario
            type: text
          - name: att
            title: Average post-treatment gap
            type: number
          - name: ratio
            title: Post / pre RMSPE ratio
            type: number

    - name: intimePlot
      title: In-time placebo
      type: Image
      width: 600
      height: 400
      renderFun: .plotIntime
      visible: (intimeFig)
      clearWith:
        - outcome
        - unit
        - time
        - treatedUnit
        - treatmentTime
        - predictors
        - predictorStat
        - donorExclude
        - optStarts
        - seed
        - intimeOffsets

    # ---- hidden results that hold reusable computations (not shown) ----
