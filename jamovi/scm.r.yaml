    - name: timingState
      title: Timing fits (internal)
      type: Image
      renderFun: .plotNone
      visible: false
      clearWith:
        - outcome
        - unit
        - time
        - treatedUnit
        - treatmentTime
        - predictors
        - predictorStat
        - donorExclude
        - optStarts
        - seed
        - timingOffsets

    - name: preLengthState
      title: Pre-period fits (internal)
      type: Image
      renderFun: .plotNone
      visible: false
      clearWith:
        - outcome
        - unit
        - time
        - treatedUnit
        - treatmentTime
        - predictors
        - predictorStat
        - donorExclude
        - optStarts
        - seed
        - preLengthDrops

    - name: intimeState
      title: In-time fits (internal)
      type: Image
      renderFun: .plotNone
      visible: false
      clearWith:
        - outcome
        - unit
        - time
        - treatedUnit
        - treatmentTime
        - predictors
        - predictorStat
        - donorExclude
        - optStarts
        - seed
        - intimeOffsets
