name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - name: Install R dependencies
        run: Rscript -e 'install.packages("quadprog", repos = "https://cloud.r-project.org")'

      - name: Run engine tests
        run: Rscript tests/run_tests.R

      - name: Run robustness tests
        run: Rscript tests/test_robustness.R
      - run: Rscript tests/test_stability.R
