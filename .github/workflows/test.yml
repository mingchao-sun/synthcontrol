name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - name: Install R dependencies
        run: Rscript -e 'install.packages(c("quadprog", "ggplot2", "testthat", "withr", "R6", "yaml"), repos = "https://cloud.r-project.org")'

      - name: Run test suite (testthat)
        run: Rscript tests/run_all.R
