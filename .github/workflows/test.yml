name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::quadprog
            any::ggplot2
            any::testthat
            any::withr
            any::R6
            any::yaml

      - name: Check required packages
        run: Rscript -e 'for (p in c("quadprog","ggplot2","testthat","withr","R6","yaml")) if (!requireNamespace(p, quietly = TRUE)) stop("missing package: ", p)'

      - name: Run test suite (testthat)
        run: Rscript tests/run_all.R
